 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Painel Catálogo TMDB</title>
  <script src="https://tailwindcss.com"></script>
  <link rel="manifest" href='data:application/manifest+json,{"name":"Meu Catálogo API","short_name":"Catálogo API","start_url":".","display":"standalone","background_color":"#020617","theme_color":"#10b981"}'>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24 select-none">

  <!-- Cabeçalho -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-10 flex justify-between items-center shadow-md">
    <h1 class="text-lg font-bold text-emerald-400">🎬 Meu Catálogo API</h1>
    <span id="status" class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">Pronto</span>
  </header>

  <main class="p-4 max-w-md mx-auto space-y-6">

    <!-- ABA 1: ADICIONAR -->
    <section id="aba-adicionar" class="space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow">
        <label class="block text-sm font-medium text-slate-300">Buscar no TMDB por ID ou Nome</label>
        <div class="flex gap-2">
          <input id="busca-tmdb" type="text" placeholder="Ex: 603 ou Matrix" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
          <select id="tipo-tmdb" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-2.5 text-sm text-white">
            <option value="movie">Filme</option>
            <option value="tv">Série</option>
          </select>
          <button onclick="buscarTMDB()" class="bg-emerald-600 active:bg-emerald-700 px-4 py-2.5 rounded-lg text-sm font-bold text-white shadow">Buscar</button>
        </div>
      </div>

      <!-- Prévia do Filme Encontrado -->
      <div id="preview-card" class="hidden bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4 shadow">
        <div class="flex gap-3">
          <img id="prev-poster" src="" alt="Capa" class="w-20 h-28 object-cover rounded-lg bg-slate-800 flex-shrink-0">
          <div class="space-y-1.5 overflow-hidden">
            <h2 id="prev-titulo" class="font-bold text-base leading-tight"></h2>
            <p id="prev-info" class="text-xs text-slate-400"></p>
            <span id="prev-id" class="inline-block bg-slate-800 text-emerald-400 text-xs font-mono px-2 py-0.5 rounded"></span>
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Link do Vídeo / Player (MP4, M3U8, Embed)</label>
          <input id="link-video" type="url" placeholder="https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <button onclick="salvarFilme()" class="w-full bg-emerald-600 active:bg-emerald-700 py-3 rounded-lg font-bold text-sm text-white shadow-lg">💾 Salvar no GitHub</button>
      </div>
    </section>

    <!-- ABA 2: BIBLIOTECA -->
    <section id="aba-biblioteca" class="hidden space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="font-bold text-base">Itens Salvos (<span id="total-itens">0</span>)</h2>
        <button onclick="carregarBiblioteca()" class="text-xs bg-slate-800 text-emerald-400 px-3 py-1.5 rounded-lg font-medium">🔄 Atualizar</button>
      </div>
      <div id="lista-filmes" class="space-y-2.5"></div>
    </section>

    <!-- ABA 3: CONFIGURAÇÕES -->
    <section id="aba-config" class="space-y-4">
      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow">
        <h2 class="font-bold text-base text-emerald-400">Chaves de Conexão</h2>
        <div>
          <label class="block text-xs text-slate-400 mb-1">API Key do TMDB (v3 ou Token)</label>
          <input id="cfg-tmdb" type="text" placeholder="Cole sua chave do TMDB" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Token do GitHub (ghp_...)</label>
          <input id="cfg-gh-token" type="password" placeholder="Cole seu ghp_..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Usuário do GitHub</label>
          <input id="cfg-gh-user" type="text" value="dasilvacostab486-code" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nome do Repositório</label>
          <input id="cfg-gh-repo" type="text" value="meu-catalogo" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
        </div>
        <button onclick="salvarConfig()" class="w-full bg-blue-600 active:bg-blue-700 py-3 rounded-lg font-bold text-sm text-white shadow">Guardar Configurações</button>
      </div>

      <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2 shadow">
        <p class="text-xs text-slate-400">Link da sua API para colocar no seu aplicativo:</p>
        <div class="flex gap-2">
          <input id="link-api-app" readonly class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-emerald-400 font-mono">
          <button onclick="copiarLinkAPI()" class="bg-slate-800 active:bg-slate-700 px-3 py-2 rounded-lg text-xs font-semibold text-white flex-shrink-0">Copiar</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Barra de Navegação Inferior -->
  <nav class="fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-800 flex justify-around py-2.5 text-xs z-20">
    <button onclick="mudarAba('adicionar')" id="btn-adicionar" class="flex flex-col items-center gap-0.5 text-emerald-400 font-semibold">➕<span>Adicionar</span></button>
    <button onclick="mudarAba('biblioteca')" id="btn-biblioteca" class="flex flex-col items-center gap-0.5 text-slate-400">📚<span>Biblioteca</span></button>
    <button onclick="mudarAba('config')" id="btn-config" class="flex flex-col items-center gap-0.5 text-slate-400">⚙️<span>Configurar</span></button>
  </nav>

  <script>
    let itemAtual = null;

    function setStatus(texto, cor = 'text-slate-300') {
      const el = document.getElementById('status');
      el.innerText = texto;
      el.className = `text-xs font-medium px-2.5 py-1 rounded-full bg-slate-800 ${cor}`;
    }

    function carregarConfig() {
      const tmdb = localStorage.getItem('tmdb_key') || '';
      const token = localStorage.getItem('gh_token') || '';
      const user = localStorage.getItem('gh_user') || 'dasilvacostab486-code';
      const repo = localStorage.getItem('gh_repo') || 'meu-catalogo';

      document.getElementById('cfg-tmdb').value = tmdb;
      document.getElementById('cfg-gh-token').value = token;
      document.getElementById('cfg-gh-user').value = user;
      document.getElementById('cfg-gh-repo').value = repo;
      document.getElementById('link-api-app').value = `https://githubusercontent.com{user}/${repo}/principal/filmes.json`;

      if (tmdb && token) {
        mudarAba('adicionar');
      } else {
        mudarAba('config');
      }
    }

    function salvarConfig() {
      const tmdb = document.getElementById('cfg-tmdb').value.trim();
      const token = document.getElementById('cfg-gh-token').value.trim();
      const user = document.getElementById('cfg-gh-user').value.trim();
      const repo = document.getElementById('cfg-gh-repo').value.trim();

      if (!tmdb || !token) {
        alert('Preencha a chave do TMDB e o Token do GitHub antes de guardar!');
        return;
      }

      localStorage.setItem('tmdb_key', tmdb);
      localStorage.setItem('gh_token', token);
      localStorage.setItem('gh_user', user);
      localStorage.setItem('gh_repo', repo);
      carregarConfig();
      alert('Configurações salvas com sucesso!');
    }

    function copiarLinkAPI() {
      const input = document.getElementById('link-api-app');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert('Link da API copiado!');
    }

    function mudarAba(aba) {
      ['adicionar', 'biblioteca', 'config'].forEach(id => {
        document.getElementById('aba-' + id).classList.add('hidden');
        document.getElementById('btn-' + id).classList.remove('text-emerald-400', 'font-semibold');
        document.getElementById('btn-' + id).classList.add('text-slate-400');
      });
      document.getElementById('aba-' + aba).classList.remove('hidden');
      document.getElementById('btn-' + aba).classList.add('text-emerald-400', 'font-semibold');
      document.getElementById('btn-' + aba).classList.remove('text-slate-400');

      if (aba === 'biblioteca') carregarBiblioteca();
    }

    async function buscarTMDB() {
      const key = localStorage.getItem('tmdb_key');
      if (!key) {
        alert('Cole sua API Key do TMDB na aba Configurar primeiro!');
        mudarAba('config');
        return;
      }

      const query = document.getElementById('busca-tmdb').value.trim();
      const tipo = document.getElementById('tipo-tmdb').value;
      if (!query) return;

      setStatus('Buscando...', 'text-amber-400');
      const isId = /^\d+$/.test(query);
      const isBearer = key.length > 40;

      let url = isId
        ? `https://themoviedb.org{tipo}/${query}?language=pt-BR`
