<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Catálogo Pro</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        h1 { font-size: 1.4rem; margin: 0; display: flex; align-items: center; gap: 8px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); }
        .section { display: none; background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .section.active { display: block; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 1rem; }
        .row { display: flex; gap: 10px; }
        .btn { padding: 12px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; width: 100%; }
        .btn-danger { background: var(--danger); color: white; padding: 6px 10px; font-size: 0.8rem; }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 15px; }
        .tmdb-item { cursor: pointer; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: var(--bg); text-align: center; }
        .tmdb-item.selected { border-color: var(--success); }
        .tmdb-item img { width: 100%; height: 150px; object-fit: cover; display: block; }
        .tmdb-item p { font-size: 0.75rem; padding: 6px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .selected-box { display: none; background: var(--bg); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid var(--success); }
        .selected-header { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
        .selected-header img { width: 60px; height: 90px; border-radius: 6px; object-fit: cover; }
        .saved-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
        .saved-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .saved-info img { width: 40px; height: 60px; border-radius: 4px; object-fit: cover; }
        .status { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; display: none; }
        .status.ok { display: block; background: rgba(16, 185, 129, 0.2); border: 1px solid var(--success); color: #6ee7b7; }
        .status.err { display: block; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎬 Painel Catálogo Rápido</h1>
        <span id="badgeCount" style="background: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.8rem;">0 itens</span>
    </header>

    <div id="statusBox" class="status"></div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('add')">➕ Adicionar</button>
        <button class="tab-btn" onclick="openTab('list')">📚 Catálogo</button>
        <button class="tab-btn" onclick="openTab('config')">⚙️ Configurar</button>
    </div>

    <!-- ABA ADICIONAR -->
    <div id="tab-add" class="section active">
        <div class="form-group">
            <label>Buscar Filme ou Série no TMDB</label>
            <div class="row">
                <select id="searchType" style="width: 110px;">
                    <option value="movie">Filme</option>
                    <option value="tv">Série</option>
                </select>
                <input type="text" id="searchQuery" placeholder="Nome ou ID (Ex: Matrix)..." onkeypress="if(event.key==='Enter') searchTMDB()">
                <button class="btn btn-primary" onclick="searchTMDB()">Buscar</button>
            </div>
        </div>

        <div id="tmdbResults" class="results-grid"></div>

        <div id="selectedBox" class="selected-box">
            <div class="selected-header">
                <img id="selPoster" src="" alt="Capa">
                <div>
                    <h3 id="selTitle" style="margin: 0 0 4px 0; font-size: 1.1rem;"></h3>
                    <small id="selMeta" style="color: var(--muted);"></small>
                </div>
            </div>
            <div class="form-group">
                <label>Link do Vídeo / Player (MP4, M3U8, Embed)</label>
                <input type="url" id="videoUrl" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Categoria (Opcional)</label>
                <input type="text" id="videoCategory" placeholder="Ex: Lançamentos, Ação, Dublado...">
            </div>
            <button class="btn btn-success" onclick="saveItem()">💾 Salvar Direto no GitHub</button>
        </div>
    </div>

    <!-- ABA CATÁLOGO -->
    <div id="tab-list" class="section">
        <div class="row" style="margin-bottom: 15px;">
            <input type="text" id="filterInput" placeholder="Filtrar itens salvos..." onkeyup="renderList()">
            <button class="btn btn-primary" onclick="loadFromGitHub()">🔄</button>
        </div>
        <div id="savedList"></div>
    </div>

    <!-- ABA CONFIGURAR -->
    <div id="tab-config" class="section">
        <div class="form-group">
            <label>API Key do TMDB (v3)</label>
            <input type="password" id="cfgTmdb" placeholder="Cole sua chave do TMDB">
        </div>
        <div class="form-group">
            <label>Token do GitHub (Classic com permissão 'repo')</label>
            <input type="password" id="cfgToken" placeholder="ghp_...">
        </div>
        <div class="row">
            <div class="form-group" style="flex:1;">
                <label>Usuário do GitHub</label>
                <input type="text" id="cfgUser" placeholder="seu-usuario">
            </div>
            <div class="form-group" style="flex:1;">
                <label>Repositório</label>
                <input type="text" id="cfgRepo" placeholder="meu-catalogo">
            </div>
        </div>
        <button class="btn btn-success" onclick="saveConfig()">Salvar Configurações</button>

        <div class="form-group" style="margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border);">
            <label>Link da sua API JSON (Use no seu Aplicativo)</label>
            <div class="row">
                <input type="text" id="apiUrlOutput" readonly>
                <button class="btn btn-primary" onclick="copyApi()">Copiar</button>
            </div>
        </div>
    </div>
</div>

<script>
    let catalog = [];
    let fileSha = "";
    let currentSelected = null;

    function showStatus(msg, isError = false) {
        const box = document.getElementById('statusBox');
        box.textContent = msg;
        box.className = 'status ' + (isError ? 'err' : 'ok');
        setTimeout(() => box.style.display = 'none', 4000);
    }

    function openTab(name) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        event.target.classList.add('active');
    }

    function getCfg() {
        return {
            tmdb: localStorage.getItem('cfg_tmdb') || '',
            token: localStorage.getItem('cfg_token') || '',
            user: localStorage.getItem('cfg_user') || '',
            repo: localStorage.getItem('cfg_repo') || ''
        };
    }

    function loadConfig() {
        const c = getCfg();
        document.getElementById('cfgTmdb').value = c.tmdb;
        document.getElementById('cfgToken').value = c.token;
        document.getElementById('cfgUser').value = c.user;
        document.getElementById('cfgRepo').value = c.repo;
        if (c.user && c.repo) {
            document.getElementById('apiUrlOutput').value = `https://${c.user}.github.io/${c.repo}/catalogo.json`;
            loadFromGitHub();
        }
    }

    function saveConfig() {
        localStorage.setItem('cfg_tmdb', document.getElementById('cfgTmdb').value.trim());
        localStorage.setItem('cfg_token', document.getElementById('cfgToken').value.trim());
        localStorage.setItem('cfg_user', document.getElementById('cfgUser').value.trim());
        localStorage.setItem('cfg_repo', document.getElementById('cfgRepo').value.trim());
        loadConfig();
        showStatus("Configurações salvas com sucesso!");
    }
